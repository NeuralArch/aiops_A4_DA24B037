global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "captioning_app"
    static_configs:
      - targets: ["localhost:8000"]
        labels:
          service: "image-captioning"

  - job_name: "node_exporter"
    static_configs:
      - targets: ["localhost:9100"]
        labels:
          service: "host-metrics"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["localhost:9093"]
